services:
  - type: web
    name: ai-problem-solver
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_PROVIDER
        sync: false
      - key: DEMO_MODEL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
